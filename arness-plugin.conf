# arness plugin manifest: arness installs this repo's skills with its plugin-manage skill.
# Format: plugins/README.md of arness. Keep skills= in sync with skills/ (tests/repo.bats checks it).
name=worktree-arness-npm-run
version=0.1.0
prefix=npm-
arness=1
description=Run npm scripts of an arness worktree in the background, wait for their exit code, and stop them before the worktree is removed
skills=npm-run
requires=git
# Run by arness (worktree-clean) before it removes a worktree, with <repo>/<name> as last argument: stops
# the npm scripts npm-run started there. A failure keeps the worktree.
hook.worktree-remove=skills/npm-run/scripts/npm-run.sh worktree-remove
